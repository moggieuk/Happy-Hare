#
# Goal: Reference macro called from 'heater_vent_macro' to vent the filament enclosure during drying
#
# (\_/)
# ( *,*)
# (")_(") Happy Hare Ready
#
#
# The drying cycle calls this every 'heater_vent_interval' minutes with UNIT=<unit name> (and GATES=<heated
# gates> for per-gate heaters). If the unit has a vent servo ([mmu_servo <unit>_vent_servo], configured in
# menuconfig under MMU Features / Additions) it is opened and, if 'run_fan' is set, the unit's managed fan is
# forced on. Both are put back after 'duration' seconds: the servo closes and each fan returns to the mode it
# was in. Without a vent servo it only logs. Settings are in mmu_macro_vars.cfg (_MMU_VENT_VARS).
# Vent servos are also closed at startup, in case Klipper restarted while a vent was open.
#
# To vent some other way, copy these macros to a file of your own, rename them and set 'heater_vent_macro'.
# NOTE: this can be called during a print so don't add delays or M400 constructs
# (read the wiki: Heater & Environment Control pages)
#
#   heater_vent_macro: _MMU_VENT
#   heater_vent_interval: <minutes>
#
[gcode_macro _MMU_VENT]
description: Reference MMU enclosure venting control (opens the unit's vent servo if fitted)
variable_vent_state: {}         # Internal: per unit, the [gate, fan mode] pairs to restore on close (gate -1 = shared fan)
gcode:
    {% set defaults = {'servo_open_angle': 90, 'servo_closed_angle': 0, 'servo_duration': 1.0, 'duration': 10, 'run_fan': 1} %}
    {% set vars = printer['gcode_macro _MMU_VENT_VARS'] if 'gcode_macro _MMU_VENT_VARS' in printer else defaults %}
    # GATES can generally be ignored unless MMU design has individual spool enclosures that can operate independently
    {% set gates = (params.GATES | default('')).split(',') | map('trim') | reject('equalto', '') | list %}
    {% set unit = params.UNIT | default('') %}
    {% if not unit and printer.mmu_machine.num_units == 1 %}
        {% set unit = printer.mmu_machine.unit_0.name %}
    {% endif %}
    {% set servo = unit ~ '_vent_servo' %}

    {% if gates %}
        MMU_LOG MSG="Opening MMU vent to dry filaments in gates: {gates | join(', ')}..."
    {% else %}
        MMU_LOG MSG="Opening MMU vent..."
    {% endif %}

    {% if unit and ('mmu_servo ' ~ servo) in printer %}
        SET_SERVO SERVO={servo} ANGLE={vars.servo_open_angle} DURATION={vars.servo_duration}

        # Save fan modes only on the first open, so a repeat call can't save the forced ON
        {% if unit not in vent_state %}
            {% set restore = [] %}
            {% set fan = printer.mmu.fans | selectattr('unit', 'equalto', unit) | first | default(none) %}
            {% if vars.run_fan and fan %}
                {% for mode in fan.modes %}
                    {% set gate = fan.first_gate + loop.index0 %}
                    {% if mode is not none and not fan.per_gate %}
                        MMU_FAN UNIT={unit} FAN_FORCED=1
                        {% do restore.append([-1, mode]) %}
                    {% elif mode is not none and (not gates or gate | string in gates) %}
                        MMU_FAN UNIT={unit} GATE={gate} FAN_FORCED=1
                        {% do restore.append([gate, mode]) %}
                    {% endif %}
                {% endfor %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_MMU_VENT VARIABLE=vent_state VALUE="{dict(vent_state, **{unit: restore})}"
        {% endif %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_MMU_VENT_CLOSE DURATION={vars.duration}


[gcode_macro _MMU_CLOSE_VENT]
description: Close the MMU enclosure vent(s) opened by _MMU_VENT and restore the fan modes
gcode:
    {% set defaults = {'servo_open_angle': 90, 'servo_closed_angle': 0, 'servo_duration': 1.0, 'duration': 10, 'run_fan': 1} %}
    {% set vars = printer['gcode_macro _MMU_VENT_VARS'] if 'gcode_macro _MMU_VENT_VARS' in printer else defaults %}
    {% set vent_state = printer['gcode_macro _MMU_VENT'].vent_state %}

    # At startup close every vent servo, in case Klipper restarted while one was open
    {% if params.STARTUP %}
        {% set servos = [] %}
        {% for i in range(printer.mmu_machine.num_units) %}
            {% set servo = printer.mmu_machine['unit_%d' % i].name ~ '_vent_servo' %}
            {% if ('mmu_servo ' ~ servo) in printer %}
                {% do servos.append(servo) %}
            {% endif %}
        {% endfor %}
        {% if servos %}
            MMU_LOG MSG="Closing MMU vent..."
        {% endif %}
        {% for servo in servos %}
            SET_SERVO SERVO={servo} ANGLE={vars.servo_closed_angle} DURATION={vars.servo_duration}
        {% endfor %}
    {% else %}
    {% set units = [params.UNIT] if params.UNIT else vent_state.keys() | list %}

        MMU_LOG MSG="Closing MMU vent..."
        {% set remaining = {} %}
        {% for unit, restore in vent_state.items() %}
            {% if unit in units %}
                SET_SERVO SERVO={unit}_vent_servo ANGLE={vars.servo_closed_angle} DURATION={vars.servo_duration}
                {% for gate, mode in restore %}
                    MMU_FAN UNIT={unit}{(' GATE=%d' % gate) if gate >= 0 else ''} FAN_FORCED={mode}
                {% endfor %}
            {% else %}
                {% do remaining.update({unit: restore}) %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_MMU_VENT VARIABLE=vent_state VALUE="{remaining}"
    {% endif %}


[delayed_gcode _MMU_VENT_CLOSE]
gcode:
    _MMU_CLOSE_VENT


[delayed_gcode _MMU_VENT_STARTUP]
initial_duration: 2.0
gcode:
    _MMU_CLOSE_VENT STARTUP=1
