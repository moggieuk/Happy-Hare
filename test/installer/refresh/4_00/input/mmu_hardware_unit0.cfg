# Pre-theme-layout [mmu_leds]: the effect_* assignments lived in the hardware file.
# These were the user's values before the theme move: two edited, one stock.
[mmu_leds unit0]
effect_error      : mmu_sparkle,                (1, 0, 0),       3
effect_heating    : mmu_breathing_blue_slow,    (0.5, 0.2, 0)
effect_initialized: mmu_rainbow,                (0.5, 0.2, 0),   8

# EXCLUDE FROM CONFIG BUILDER -- IMPORTANT do not alter or remove this line. Config below is never upgraded
[temperature_sensor fixture_chamber]
sensor_type: Generic 3950
sensor_pin: unit0:PA0
