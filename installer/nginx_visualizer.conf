# Happy Hare Visualizer: a separate nginx site, beside Mainsail/Fluidd, on its own port.
# It serves the viewer folder and proxies Moonraker, so the page shares an origin with the API.
server {
    listen %PORT%;
    # listen [::]:%PORT%;

    server_name _;
    root %ROOT%;
    index index.html;

    access_log /var/log/nginx/happy-hare-visualizer-access.log;
    error_log /var/log/nginx/happy-hare-visualizer-error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /websocket {
        proxy_pass http://127.0.0.1:%UPSTREAM%/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://127.0.0.1:%UPSTREAM%$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}
