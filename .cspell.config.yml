---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
language: 'en-US, en-GB'
dictionaryDefinitions:
    - name: project-words
      path: './.project-words.txt'
      addWords: true
dictionaries:
    - project-words
ignorePaths:
    - '/venv/'
    - '/.project-words.txt'
overrides:
  - filename: "**/*.py"
    ignoreRegExpList:
      # Ignore identifiers followed by brackets (recs[-1])
      - "/\\b\\w+\\b(?=\\[)/"

      # Ignore identifiers followed by parentheses (func())
      - "/\\b\\w+\\b(?=\\s*\\(|\\()/"

      # Ignore attribute access (.attr)
      - "/\\.\\b\\w+\\b/"

      # Ignore assignments (var = or var=)
      - "/\\b\\w+\\b(?=\\s*=)/"

      # Ignore class/function definitions
      - "/\\b(def|class)\\s+\\w+/"

      # Ignore imports
      - "/\\b(import|from|as)\\b/"

      # Ignore decorators
      - "/@\\b\\w+\\b/"

    # Add project-specific identifiers here
    words:
      - recs
      - meas
      - filpos
      - printer
      - oo
      - twinx
      - facecolor
      - axhline
      - ylabel
      - fontsize
      - ylim
      - twiny
      - xlim
      - labelsize
      - xlabel
      - interp
      - kwds
      - kwargs
      - cls
