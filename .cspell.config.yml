---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
language: 'en-US'
dictionaryDefinitions:
    - name: project-words
      path: './.project-words.txt'
      addWords: true
dictionaries:
    - project-words
ignorePaths:
    - '/venv/'
    - '/.project-words.txt'
# Preserve existing identifiers and literal option syntax without accepting British
# spellings or arbitrary option-letter sequences as general project vocabulary.
ignoreRegExpList:
    # Existing constant and a documented historical typo; neither is prose.
    - '/\bAUTHORZIED_SLICERS\b|\bLINEAR_MUTLI_GEAR_SELECTOR\b/'
    - '/\b_normalise_uid\b/'
    - '/\bNFC_FIELD_NEIGHBOUR\b|\bNEIGHBOUR\b/'
    - '/\breturn travelled\b|\bassertAlmostEqual\(travelled,/'
    - '/\bgetopts "rehfiudylpzsb:nk:c:m:a:toqv"/'
overrides:
  - filename: "**/*.py"
    ignoreRegExpList:
      # Ignore identifiers followed by brackets (recs[-1])
      - "/\\b\\w+\\b(?=\\[)/"

      # Ignore identifiers followed by parentheses (func())
      - "/\\b\\w+\\b(?=\\s*\\(|\\()/"

      # Ignore attribute access (.attr)
      - "/\\.\\b\\w+\\b/"

      # Ignore assignments (var = or var=)
      - "/\\b\\w+\\b(?=\\s*=)/"

      # Ignore class/function definitions
      - "/\\b(def|class)\\s+\\w+/"

      # Ignore imports
      - "/\\b(import|from|as)\\b/"

      # Ignore decorators
      - "/@\\b\\w+\\b/"

    # Add project-specific identifiers here
    words:
      - recs
      - meas
      - filpos
      - printer
      - oo
      - twinx
      - facecolor
      - axhline
      - ylabel
      - fontsize
      - ylim
      - twiny
      - xlim
      - labelsize
      - xlabel
      - interp
      - kwds
      - kwargs
      - cls
