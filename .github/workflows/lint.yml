name: Lint

on:
  push:
    branches: [v4, main]
  pull_request:
    branches: [v4, main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.4"
          args: "check --output-format=github"
