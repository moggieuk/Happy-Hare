name: Label merge conflicts

on:
  # Metadata only: never check out or execute code from a PR.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['**']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

# Every run checks all open PRs, so a newer queued run can replace an older one.
concurrency:
  group: merge-conflict-labels
  cancel-in-progress: false

jobs:
  label:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Update merge-conflict labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const name = 'merge-conflict';
            const color = 'B60205';
            const description = 'Has merge conflicts with the target branch';
            try {
              const { data: label } = await github.rest.issues.getLabel({ owner, repo, name });
              if (label.color.toUpperCase() !== color || label.description !== description) {
                await github.rest.issues.updateLabel({ owner, repo, name, color, description });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name, color, description });
            }

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            for (const { number } of prs) {
              let pr;
              // GitHub calculates mergeability asynchronously; null is not a conflict.
              for (let attempt = 0; attempt < 6; attempt++) {
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
                if (pr.state !== 'open' || typeof pr.mergeable === 'boolean') break;
                if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 3000));
              }
              if (pr.state !== 'open') continue;
              if (typeof pr.mergeable !== 'boolean') {
                core.warning(`#${number}: mergeability still unknown; leaving label unchanged until the next run.`);
                continue;
              }
              const hasLabel = pr.labels.some(label => label.name === name);
              if (pr.mergeable === false && !hasLabel) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [name] });
                core.info(`#${number}: added ${name}`);
              } else if (pr.mergeable === true && hasLabel) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                core.info(`#${number}: removed ${name}`);
              }
            }
